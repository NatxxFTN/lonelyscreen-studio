; Plugin quality : filtrage + post-traitement de l'image
[quality]
enabled=1
; anisotropic (meilleur) ou linear
mode=anisotropic
; 1 à 16, limité automatiquement par la carte graphique
max_anisotropy=8
; Netteté 0..100 (0 = désactivée)
sharpen=40
; Contraste 50..150 (100 = inchangé)
contrast=100
; Saturation 0..200 (100 = inchangée, 0 = noir et blanc)
saturation=100
; Luminosité -50..50 (0 = inchangée)
brightness=0
