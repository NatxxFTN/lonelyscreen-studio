; Plugin frame : bordure et teinte par-dessus l'image
[frame]
enabled=1
; Couleur de bordure : #RRGGBB ou #AARRGGBB (AA = opacité)
border_color=#FF7C3AED
; Épaisseur en pixels (0 = pas de bordure, max 64)
border_px=6
; Teinte : #AARRGGBB, AA=00 désactive. Exemple mode nuit : #30FF8000
tint_color=#00000000
