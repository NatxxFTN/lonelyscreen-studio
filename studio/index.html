<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-src https://user.ls 'self'; connect-src 'self'; font-src 'self'">
<title>LonelyScreen Studio</title>
<link rel="preload" href="fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <aside class="rail" id="rail" aria-label="Studio"></aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-button" id="back" data-action="back" aria-label="Retour" disabled></button>
      <label class="search">
        <span id="search-icon"></span>
        <span class="sr-only">Rechercher dans la boutique</span>
        <input id="search" type="search" placeholder="Rechercher thèmes, effets, apps" autocomplete="off" spellcheck="false">
      </label>
      <span class="spacer"></span>
      <button class="icon-button" id="close" data-action="close" aria-label="Fermer le Studio" title="Fermer (Ctrl+Maj+P)"></button>
    </header>
    <main class="content" id="content">
      <div class="view">
        <div class="skeleton" style="height:220px"></div>
        <div class="skeleton" style="height:120px"></div>
      </div>
    </main>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
